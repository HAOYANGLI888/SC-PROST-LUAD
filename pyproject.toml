[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scprost-luad"
version = "0.0.1"
description = "Single-cell-guided pathology and proteogenomic multimodal survival modeling for LUAD."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "numexpr>=2.10.2",
  "bottleneck>=1.4.2",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "tabulate>=0.9",
  "torch>=2.2",
  "PyYAML>=6.0",
  "requests>=2.31",
  "tqdm>=4.66",
  "python-docx>=1.1",
  "anndata>=0.12,<0.13; python_version >= '3.11'",
  "anndata>=0.10,<0.12; python_version < '3.11'",
  "scanpy>=1.10,<1.12",
  "umap-learn>=0.5",
  "h5py>=3.10",
  "zarr>=2.18.7,<3",
]

[project.scripts]
scprost-luad = "scprost_luad.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
